name: skill-lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint skill pack
        run: node scripts/skill-lint.mjs .
      - name: Check script syntax
        run: |
          node --check scripts/skill-lint.mjs
          node --check scripts/model-smoke.mjs
          node --check skills/judge-and-verify/scripts/observe.mjs
          node --check skills/judge-and-verify/scripts/verify.mjs
          node --check skills/judge-and-verify/scripts/judge-packet.mjs
          node --check skills/judge-and-verify/scripts/claim-ledger.mjs
